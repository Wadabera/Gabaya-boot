version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gebeya-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gebeya_boot
    ports:
      - "5435:5432"
    volumes:
      - gebeya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gebeya_boot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gebeya-redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - gebeya_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gebeya_pgdata:
  gebeya_redisdata:
